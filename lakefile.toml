name = "hex-real-roots-mathlib"
defaultTargets = ["HexRealRootsMathlib"]

leanOptions = [
  { name = "doc.verso", value = true },
  { name = "doc.verso.suggestions", value = false },
]

[[require]]
name = "HexRealRoots"
git = "https://github.com/leanprover/hex-real-roots.git"
rev = "2db2ee65daa2cea203768628e0b88431df8faf31"

[[require]]
name = "HexPolyZMathlib"
git = "https://github.com/leanprover/hex-poly-z-mathlib.git"
rev = "688a3dfb76e2fd18a63236b9c55df4f8f1956ea3"

[[require]]
name = "HexPolyMathlib"
git = "https://github.com/leanprover/hex-poly-mathlib.git"
rev = "1b044cdd65e62c4538e710aaf2989ebf6065c536"

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.34.0-rc2"

[[require]]
name = "HexPolyZ"
git = "https://github.com/leanprover/hex-poly-z.git"
rev = "1f22e9a8ae948501ab56e37a4cdb8153e60be9c9"

[[lean_lib]]
name = "HexRealRootsMathlib"

[[lean_lib]]
name = "HexRealRootsMathlibTests"
globs = ["HexRealRootsMathlib.IsolateRootsTests", "HexRealRootsMathlib.IsolateRootsElabTests"]
