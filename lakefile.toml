name = "hex-real-roots-mathlib"
defaultTargets = ["HexRealRootsMathlib"]

leanOptions = [
  { name = "doc.verso", value = true },
  { name = "doc.verso.suggestions", value = false },
]

[[require]]
name = "HexRealRoots"
git = "https://github.com/leanprover/hex-real-roots.git"
rev = "6ef2d084aa2ebf00b575be4f5b1931b89b223cea"

[[require]]
name = "HexPolyZMathlib"
git = "https://github.com/leanprover/hex-poly-z-mathlib.git"
rev = "d9097b71aa14539fc6c501eafbc6f4f21c7dbbbf"

[[require]]
name = "HexPolyMathlib"
git = "https://github.com/leanprover/hex-poly-mathlib.git"
rev = "e139e3635ec2748ba3c3784b1f83874efcb2410e"

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.32.2"

[[lean_lib]]
name = "HexRealRootsMathlib"

[[lean_lib]]
name = "HexRealRootsMathlibTests"
globs = ["HexRealRootsMathlib.IsolateRootsTests", "HexRealRootsMathlib.IsolateRootsElabTests"]
